appId: com.orcinus-orca.app
productName: Orcinus orca
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/builtin/**'
asarUnpack:
  - resources/**
  # SDK 번들 native binary(claude[.exe])는 asar 내부에선 spawn 불가 → 실디스크로 언팩.
  # (설치된 플랫폼 패키지만 매칭 — npm 은 os/cpu 일치본만 설치. 상세: adapters/claude-executable.ts)
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # better-sqlite3 native binding(build/Release/better_sqlite3.node)은 asar 내부에서 로드 불가
  # → 실디스크로 언팩. (dev 는 asar 없어 미재현, packaged 만 "better_sqlite3.node not found". 0114)
  - node_modules/better-sqlite3/**
extraResources:
  - from: resources/builtin
    to: builtin
win:
  executableName: orcinus-orca
  # build/ 에 icon.ico 가 없으므로 경로를 명시한다 — electron-builder 가 png 에서
  # 다해상도 ico 를 생성한다(원본 1254px). buildResources 기본 탐색명은 icon.* 라 해석되지 않는다. (0227)
  icon: build/logo.png
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/logo.png
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/logo.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# 패키징 직전에 production native dependency 를 대상 Electron ABI 로 다시 빌드한다.
# release 게이트의 `npm test` 가 better-sqlite3 를 Node ABI 로 바꾸므로 비활성화하면 안 된다. (0114 r2)
npmRebuild: true
publish:
  provider: github
  owner: muzaby
  repo: orca-skin
  releaseType: release
