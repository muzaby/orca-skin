<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Orca · Electron 데스크톱 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles/tokens.css"/>
<style>
  :root {
    --serif: 'Source Serif 4', ui-serif, Georgia, serif;
    --sans: 'Inter', ui-sans-serif, -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Windows 11-ish desktop background — soft bloom wallpaper */
  .desktop {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,200,160,.45), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(160,140,210,.35), transparent 60%),
      linear-gradient(135deg, #4a3a52 0%, #2d2438 50%, #1a1822 100%);
    overflow: hidden;
  }

  /* Windows taskbar */
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: rgba(28,26,32,.65);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; padding: 0 12px; gap: 8;
    z-index: 5;
  }
  .taskbar-icons { display: flex; gap: 4px; flex: 1; justify-content: center; }
  .tb-icon {
    width: 36px; height: 36px; border-radius: 6px;
    display: grid; place-items: center; font-size: 16px;
    color: rgba(255,255,255,.85);
    cursor: default;
    position: relative;
  }
  .tb-icon:hover { background: rgba(255,255,255,.08); }
  .tb-icon.active { background: rgba(255,255,255,.06); }
  .tb-icon.active::after {
    content: ''; position: absolute; bottom: -2px; left: 25%; right: 25%;
    height: 2px; background: var(--rust, #c96442); border-radius: 1px;
  }
  .tb-tray { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.85); font-size: 11.5px; }
  .tb-tray .badge {
    width: 16px; height: 16px; background: var(--rust, #c96442);
    border-radius: 4px; display: grid; place-items: center;
    color: #fff; font-family: var(--serif); font-weight: 700; font-size: 10px;
  }
  .tb-clock { line-height: 1.15; text-align: right; font-size: 11px; }
  .tb-clock .date { font-size: 10px; opacity: .75; }

  /* App window — frameless Electron BrowserWindow */
  .app-window {
    position: absolute;
    width: 1280px; height: 820px;
    top: 50%; left: 50%; transform: translate(-50%, calc(-50% - 24px));
    background: #fbf9f4;
    border-radius: 8px;
    box-shadow:
      0 0 0 .5px rgba(0,0,0,.4),
      0 32px 80px rgba(0,0,0,.45),
      0 8px 24px rgba(0,0,0,.3);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform-origin: center center;
  }

  /* The native ::-webkit-app-region: drag would live on the titlebar inside V1Frame */

  /* Auto-scale the desktop to fit any viewport. */
  .stage {
    position: fixed; inset: 0;
    transform-origin: center center;
  }

  /* Mini banner */
  .mockup-tag {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    padding: 6px 12px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
    color: rgba(255,255,255,.92);
    font-family: var(--mono); font-size: 11px; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .mockup-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #5a8a4f; box-shadow: 0 0 0 3px rgba(90,138,79,.25); }
  .mockup-tag a { color: rgba(255,255,255,.6); text-decoration: none; margin-left: 6px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.15); }
  .mockup-tag a:hover { color: #fff; }

  /* Floating screen switcher — lets you flip the renderer through its screens */
  .screen-tabs {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    display: flex; gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
  }
  .screen-tabs button {
    appearance: none; border: 0; background: transparent;
    color: rgba(255,255,255,.7);
    padding: 5px 12px;
    border-radius: 999px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .3px;
    cursor: default;
  }
  .screen-tabs button:hover { color: #fff; background: rgba(255,255,255,.06); }
  .screen-tabs button.active { background: #fff; color: #29261b; font-weight: 600; }

  /* Window-frame badges */
  .win-badge {
    position: absolute; top: 12px; padding: 3px 8px;
    background: rgba(0,0,0,.45); color: #fff;
    border-radius: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .3px;
    pointer-events: none;
  }

  /* The V1 frame defines its own height/width; constrain it to fill the window. */
  .app-window .app-frame {
    width: 100%; height: 100%;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
</style>
</head>
<body>

<div class="desktop">
  <div class="mockup-tag">
    <span class="dot"></span>
    Orca · Electron BrowserWindow on Windows 11
    <a href="architecture.html">아키텍처 문서 →</a>
  </div>

  <div class="stage" id="stage">
    <div class="app-window" id="appWin"></div>
  </div>

  <div class="taskbar">
    <div class="tb-icon" title="Start">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="rgba(255,255,255,.85)"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    </div>
    <div class="tb-icon" title="Search">🔍</div>
    <div class="taskbar-icons">
      <div class="tb-icon">📁</div>
      <div class="tb-icon">🌐</div>
      <div class="tb-icon">✉</div>
      <div class="tb-icon active" title="Orca">
        <div style="width:18px;height:18px;border-radius:4px;background:#c96442;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:11px;">O</div>
      </div>
      <div class="tb-icon">⚙</div>
    </div>
    <div class="tb-tray">
      <span style="opacity:.7">▲</span>
      <div class="badge">O</div>
      <span style="opacity:.7">🔊</span>
      <span style="opacity:.7">📶</span>
      <div class="tb-clock"><div>14:42</div><div class="date">2026-05-10</div></div>
    </div>
  </div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>const { useState, useEffect, useRef, useCallback, useMemo } = React;</script>
<script type="text/babel" data-presets="react" src="../shared/atoms.jsx"></script>
<script type="text/babel" data-presets="react" src="../variations/v1-shell.jsx"></script>
<script type="text/babel" data-presets="react" src="../variations/v1-screens.jsx"></script>

<script type="text/babel" data-presets="react">
  // Mount the V1 main screen inside the Electron BrowserWindow.
  // Screens reflect the Variation A renderer set: chat (dual-pane main),
  // projects dashboard, engine & model settings, skills/MCP, capture history.
  const SCREENS = [
    { id: 'chat',      label: '01 채팅' },
    { id: 'projects',  label: '02 프로젝트' },
    { id: 'engine',    label: '03 엔진 & 모델' },
    { id: 'skills',    label: '04 Skills / MCP' },
    { id: 'captures',  label: '05 캡처 히스토리' },
  ];

  const TITLEBAR_BREADCRUMB = {
    chat:     null,
    projects: '프로젝트',
    engine:   '설정 · 엔진 & 모델',
    skills:   '설정 · Skills & MCP',
    captures: '캡처 히스토리',
  };

  function ElectronApp() {
    const [screen, setScreen] = React.useState('chat');

    let body;
    if (screen === 'chat') {
      body = (
        <>
          <V1ChatPane/>
          <V1CameraPane/>
        </>
      );
    } else if (screen === 'projects')  body = <V1Projects/>;
    else if (screen === 'engine')    body = <V1EngineSettings/>;
    else if (screen === 'skills')    body = <V1SkillsMcp/>;
    else if (screen === 'captures')  body = <V1Captures/>;

    return (
      <>
        <div className="screen-tabs">
          {SCREENS.map((s) => (
            <button key={s.id} className={s.id === screen ? 'active' : ''} onClick={() => setScreen(s.id)}>{s.label}</button>
          ))}
        </div>
        <div id="appWinInner" style={{ width: '100%', height: '100%' }}>
          <V1Frame label={`Orca · ${SCREENS.find((s) => s.id === screen).label}`}>
            <V1Titlebar breadcrumb={TITLEBAR_BREADCRUMB[screen]}/>
            <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
              <V1Sidebar active={screen}/>
              {body}
            </div>
          </V1Frame>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('appWin')).render(<ElectronApp/>);

  // Auto-scale the whole desktop (stage + taskbar already use fixed positioning;
  // we just scale the .app-window to keep it inside the viewport.)
  function fit() {
    const win = document.getElementById('appWin');
    const W = window.innerWidth, H = window.innerHeight - 48; // taskbar
    const sx = (W - 80) / 1280, sy = (H - 80) / 820;
    const s = Math.min(1, sx, sy);
    win.style.transform = `translate(-50%, calc(-50% - 24px)) scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
