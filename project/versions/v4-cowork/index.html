<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Orca v4 · Cowork</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; background: #1a1822; }
  * { box-sizing: border-box; }

  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 35% 25%, rgba(255,200,160,.18), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(180,150,210,.18), transparent 60%),
      linear-gradient(135deg, #2a2520 0%, #1a1822 60%, #100e15 100%);
    overflow: hidden;
  }

  .app-window {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1280px; height: 820px;
    background: #fbf9f4;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.4), 0 32px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3);
    transform-origin: center center;
    display: flex; flex-direction: column;
  }

  .mockup-tag {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    padding: 6px 12px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
    color: rgba(255,255,255,.92);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .mockup-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #c96442; box-shadow: 0 0 0 3px rgba(201,100,66,.25); }
  .mockup-tag a { color: rgba(255,255,255,.6); text-decoration: none; margin-left: 6px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.15); }
  .mockup-tag a:hover { color: #fff; }

  .screen-tabs {
    position: fixed; right: 16px; top: 16px; z-index: 10;
    display: flex; gap: 4px;
    padding: 4px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
  }
  .screen-tabs button {
    appearance: none; border: 0; background: transparent;
    color: rgba(255,255,255,.7);
    padding: 5px 12px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .3px;
    cursor: pointer;
  }
  .screen-tabs button:hover { color: #fff; background: rgba(255,255,255,.06); }
  .screen-tabs button.active { background: #fff; color: #29261b; font-weight: 600; }
</style>
</head>
<body>

<div class="stage">
  <div class="mockup-tag">
    <span class="dot"></span>
    Orca v4 · Cowork pattern
    <a href="../index.html">← 버전 목록</a>
  </div>
  <div class="app-window" id="appWin"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react" src="orca-cowork.jsx"></script>

<script type="text/babel" data-presets="react">
  const SCREENS = [
    { id: 'home',    label: '01 홈' },
    { id: 'dropdown',label: '02 프로젝트 드롭다운' },
    { id: 'entry',   label: '03 새 프로젝트' },
    { id: 'scratch', label: '04 처음부터' },
    { id: 'import',  label: '05 가져오기' },
    { id: 'existing',label: '06 기존 폴더' },
  ];

  const RECENTS = [
    { id: 'cs', t: 'Create new project with Paint' },
    { id: 'ns', t: 'New scheduled task' },
  ];

  function CoworkApp() {
    const [screen, setScreen] = React.useState('home');
    const projectAnchorRef = React.useRef(null);
    const isModal = screen !== 'home' && screen !== 'dropdown';
    const modalKind = isModal ? (
      screen === 'entry' ? 'entry' :
      screen === 'scratch' ? 'scratch' :
      screen === 'import' ? 'import' :
      'existing'
    ) : null;

    return (
      <>
        <div className="screen-tabs">
          {SCREENS.map((s) => (
            <button key={s.id} className={s.id === screen ? 'active' : ''} onClick={() => setScreen(s.id)}>{s.label}</button>
          ))}
        </div>

        <CWTitlebar/>
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <CWSidebar
            mode="cowork"
            active="newTask"
            recents={RECENTS}
            recentActive={null}
            onNew={() => {}}
            onMode={() => {}}
            onNav={() => {}}
            onRecent={() => {}}
          />
          <CWHome
            projectAnchorRef={projectAnchorRef}
            onProjectDropdown={() => setScreen('dropdown')}
            currentProject={{ name: 'C:\\Users\\rlaeo\\Downloads' }}
          />
        </div>

        {screen === 'dropdown' && (
          <CWProjectDropdown
            anchorEl={projectAnchorRef.current}
            onClose={() => setScreen('home')}
            onCreate={() => setScreen('entry')}
            onSelect={() => setScreen('home')}
            projects={[]}
          />
        )}

        {isModal && (
          <CWModal
            kind={modalKind}
            onClose={() => setScreen('home')}
            onSwitch={(k) => setScreen(k)}
            onCreate={() => setScreen('home')}
          />
        )}
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('appWin')).render(<CoworkApp/>);

  function fit() {
    const win = document.getElementById('appWin');
    const W = window.innerWidth, H = window.innerHeight;
    const sx = (W - 80) / 1280, sy = (H - 80) / 820;
    const s = Math.min(1, sx, sy);
    win.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
