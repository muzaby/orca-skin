<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Orca v3 · Modern Hybrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  :root {
    --serif: 'Source Serif 4', ui-serif, Georgia, serif;
    --sans: 'Inter', ui-sans-serif, -apple-system, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; background: #1c1a14; }
  * { box-sizing: border-box; }

  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 75% 25%, rgba(255,200,170,.18), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(100,90,140,.22), transparent 65%),
      linear-gradient(135deg, #2a261f 0%, #1c1a14 60%, #100e0a 100%);
    overflow: hidden;
  }

  .app-window {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1280px; height: 820px;
    background: #fbf9f4;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.4), 0 32px 80px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.3);
    display: flex; flex-direction: column;
    transform-origin: center center;
  }
  .app-window .app-frame { width: 100%; height: 100%; border-radius: 0 !important; box-shadow: none !important; display: flex; flex-direction: column; }
  .titlebar { display: flex; align-items: center; }

  .mockup-tag {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    padding: 6px 12px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px;
    color: rgba(255,255,255,.92);
    font-family: var(--mono); font-size: 11px; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .mockup-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: #c96442; box-shadow: 0 0 0 3px rgba(201,100,66,.25); }
  .mockup-tag a { color: rgba(255,255,255,.6); text-decoration: none; margin-left: 6px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.15); }
  .mockup-tag a:hover { color: #fff; }
</style>
</head>
<body>

<div class="stage">
  <div class="mockup-tag">
    <span class="dot"></span>
    Orca v3 · Modern Hybrid
    <a href="../index.html">← 버전 목록</a>
  </div>
  <div class="app-window" id="appWin"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>const { useState, useEffect, useRef, useCallback, useMemo } = React;</script>
<script type="text/babel" data-presets="react" src="atoms.jsx"></script>
<script type="text/babel" data-presets="react" src="shell.jsx"></script>

<script type="text/babel" data-presets="react">
  function V3App() {
    return (
      <V3Frame label="Orca v3 · Modern Hybrid">
        <V3Titlebar/>
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <V3IconRail/>
          <V3SecondPanel/>
          <V3ChatPane/>
          <V3CameraPane/>
        </div>
      </V3Frame>
    );
  }
  ReactDOM.createRoot(document.getElementById('appWin')).render(<V3App/>);

  function fit() {
    const win = document.getElementById('appWin');
    const W = window.innerWidth, H = window.innerHeight;
    const sx = (W - 80) / 1280, sy = (H - 80) / 820;
    const s = Math.min(1, sx, sy);
    win.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
